name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wyrmhaven/server test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge install foundry-rs/forge-std@v1.9.7 --no-git
      - name: Format check
        working-directory: contracts
        run: forge fmt --check
      - name: Tests
        working-directory: contracts
        run: forge test -vv

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @wyrmhaven/web exec playwright install --with-deps chromium
      # playwright.config.ts starts the server (E2E=1, in-memory PGlite) and Vite itself.
      - run: pnpm --filter @wyrmhaven/web test:e2e

  deploy-bundle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The real env files never exist in the repo; the examples stand in for config validation.
      - name: Compose config
        working-directory: deploy
        run: |
          cp .env.example .env
          cp .env.server.example .env.server
          docker compose -f docker-compose.yml config --quiet
      - name: Caddyfile validates
        run: >-
          docker run --rm -e PLAY_DOMAIN=play.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t dragon-island-server:ci .
      # Proves the image's non-root user can run pnpm scripts and that drizzle/ is in the image.
      - name: db:migrate in the image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/migrate
          dragon-island-server:ci pnpm db:migrate
      - name: Shellcheck
        run: shellcheck deploy/*.sh
